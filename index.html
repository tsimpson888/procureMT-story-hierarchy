ns": {"mvp": true, "stories": [{"id": "6", "title": "RBAC-Config", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": "", "mvp": true}]}, "Assignment Groups and Members Management": {"mvp": true, "stories": [{"id": "7", "title": "Assignment Groups-Config", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": "I need to configure assignment groups so that requests can be routed appropriately.", "mvp": true}, {"id": "10", "title": "Assignment Groups-Create", "status": "1a-Not Started", "priority": "", "user": "Agency IT", "desc": "", "mvp": true}, {"id": "11", "title": "Assignment Groups-Manage", "status": "1a-Not Started", "priority": "", "user": "Agency IT", "desc": "", "mvp": true}]}, "System Security and Authentication": {"mvp": true, "stories": [{"id": "47", "title": "System Security and Authentication", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": true}]}}}, "Assignment & Work Distribution": {"features": {"Auto/Manual Step & Group Progression": {"mvp": true, "stories": [{"id": "9", "title": "Post Approval Routing", "status": "2-Design", "priority": "1-must have", "user": "System", "desc": "I need to evaluate specific refined info (fields) once the request has been approved so the request is routed to the appropriate Assignment Group and Step/Status for sourcing actions.\n\nThis story represents the expected system evaluation and logic behind the automatic Assignment Group and automatic Step/Status update that is triggered upon a Request entering the Approval/Approved Step/Status.", "mvp": true}, {"id": "15", "title": "Auto Step Upon Save as Draft", "status": "2-Design", "priority": "3-could have", "user": "System", "desc": "I need to auto update the step/status to Request/Draft upon save as draft.", "mvp": true}, {"id": "18", "title": "Auto Step Upon Submit", "status": "6a-Ready for BA Testing", "priority": "1-must r story - see feature description", "mvp": true}]}, "Auto Procurement Method Classification": {"mvp": false, "stories": [{"id": "50", "title": "Auto Procurement Method Classification", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}, "Auto Round Robin Rerouting Capabilities": {"mvp": false, "stories": [{"id": "51", "title": "Auto Round Robin Rerouting Capabilities", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}, "Escalations": {"mvp": false, "stories": [{"id": "52", "title": "Escalations", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}, "Manual Workload Management": {"mvp": false, "stories": [{"id": "53", "title": "Manual Workload Management", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}, "Dynamic Workflow Reroute": {"mvp": true, "stories": [{"id": "65", "title": "Dynamic Workflow Rerouting", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": true}]}}}, "Request Intake & Management": {"features": {"Request Management": {"mvp": true, "stories": [{"id": "12", "title": "Create Request - Enterprise Fields", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "Requester", "desc": "I must be able to create a request on an easy-to-find procurement request form, so that I can initiate a purchase request.", "mvp": true}, {"id": "14", "title": "Save Draft Request", "status": "2-Design", "priority": "3-could have", "user": "Requester", "desc": "I must be able to save my request as a draft, so that I can gather information over time and submit when ready.", "mvp": true}, {"id": "16", "title": "Submit Request", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "Requester", "desc": "I must be able to submit the request form.  I want the system to validate my form on submit, so that I know I've provided all required information.  I must receive confirmation and a tracking number upon a successful submit, so that I can reference it in future communications.", "mvp": true}]}, "Attachment Management": {"mvp": true, "stories": [{"id": "13", "title": "Add Attachments During Request", "status": "2-Design", "priority": "1-must have", "user": "Requester", "desc": "I must be able to attach supporting documents to my request prior to submitting my request, so that reviewers have complete information.", "mvp": true}, {"id": "26", "title": "Add Attachments After Submission", "status": "2-Design", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I must be able to attach supporting documents to any request I have access to, so that reviewers have complete information.", "mvp": true}, {"id": "67", "title": "Attachments - FileNet Capabilities Outside of User Stories", "status": "1a-Not Started", "priority": "", "user": "", "desc": "FileNet capabilities that haven't yet been called out in related attachment stories.  Do we need any of their capabilities?  Which ones?  By when?", "mvp": true}]}, "Refined Request Management": {"mvp": true, "stories": [{"id": "24", "title": "View Original Request Details", "status": "3a-Hand-off to Product Mgr", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to see the request details so that I know what is being requested.  I should not be able to edit the original request details.\n\nInformation must be organized in a logical, easy-to-navigate fashion.", "mvp": true}, {"id": "25", "title": "Add Refinement Details", "status": "3a-Hand-off to Product Mgr", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to refine a request by adding information to it.\n\nThe refinement area must be organized in a logical, easy-to-navigate fashion.", "mvp": true}]}, "Cancelations": {"mvp": true, "stories": [{"id": "33", "title": "Cancelations", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": true}]}}}, "Reporting & Insights": {"features": {"Queue Interface": {"mvp": true, "stories": [{"id": "22", "title": "Threshold Procurement Group Queues", "status": "2-Design", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I must be able to see requests organized by Threshold to facilitate workload management.", "mvp": true}, {"id": "23", "title": "Procurement Group Queue-Details", "status": "3b-In Development", "priority": "2-should have", "user": "Procurement Group", "desc": "I must be able to see key request information while looking at the queue to facilitate workload management.", "mvp": true}, {"id": "38", "title": "Sourcing Procurement Group Queues", "status": "1b-Draft", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I must be able to see requests organized by Sourcing queues to facilitate workload management.", "mvp": true}]}, "Search and Filter Capabilities": {"mvp": true, "stories": [{"id": "37", "title": "Search and Filter Capabilities", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": true}]}, "Operational Reports": {"mvp": false, "stories": [{"id": "60", "title": "Operational Reports", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}, "Dashboards": {"mvp": false, "stories": [{"id": "61", "title": "Dashboards", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}}}, "Approvals": {"features": {"Approval Path Builder": {"mvp": true, "stories": [{"id": "28", "title": "Approval Path Builder", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": true}]}, "Approval Path Execution": {"mvp": true, "stories": [{"id": "29", "title": "Approval Path Execution", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": true}]}, "Approval Path Override": {"mvp": false, "stories": [{"id": "30", "title": "Approval Path Override", "status": "1a-Not Started", "priority": "", "user": "", "desc": "", "mvp": false}]}, "Auto IT Approval Needed Classification": {"mvp": false, "stories": [{"id": "48", "title": "Auto IT Approval Needed Classification", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}, "Auto OBPP Approval Required Classification": {"mvp": false, "stories": [{"id": "49", "title": "Auto OBPP Approval Required Classification", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description", "mvp": false}]}}}, "Unassigned": {"features": {"Unassigned": {"mvp": false, "stories": [{"id": "39", "title": "Delegation Setup In Database (Cross‑Cutting)", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a system architect, I want delegation set up in the database as a cross‑cutting capability, so future security and features can be built with delegation in mind across the whole application.", "mvp": false}, {"id": "40", "title": "Fix Test Procurement API Deployment", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a developer, I want the test procurement API to deploy and stay healthy, so the back end can be tested and used.", "mvp": false}, {"id": "41", "title": "Make Environment Secrets File Work", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a developer, I want the environment (secrets) file to generate correctly, so the app has the passwords and other secrets it needs to run.", "mvp": false}, {"id": "42", "title": "Show Front End Is Up (Even If Back End Is Not)", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a product owner, I want to see that the front end deploys and users can log in, so we can show visible progress even while the back end is still down.", "mvp": false}]}}}};
const row = document.getElementById('themes-row');
const searchInput = document.getElementById('q-search');
const statusSelect = document.getElementById('f-status');
const prioritySelect = document.getElementById('f-priority');
const userSelect = document.getElementById('f-user');
const mvpSelect = document.getElementById('f-mvp');
const resetBtn = document.getElementById('btn-reset');
const summary = document.getElementById('summary');
const canvasEl = document.getElementById('canvas');
const trackEl = document.getElementById('scroll-track');
const innerEl = document.getElementById('scroll-track-inner');

function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function statusClass(s){if(!s)return's-other'; if(s.includes('Complete')||s.includes('PASS'))return's-complete'; if(s.includes('QA'))return's-qa'; if(s.includes('Development'))return's-dev'; if(s.includes('Design'))return's-design'; if(s.includes('Hand-off'))return's-handoff'; if(s.includes('Not Started'))return's-notstarted'; if(s.includes('Draft'))return's-draft'; if(s.includes('BA'))return's-ba'; return's-other';}
function priorityClass(p){if(!p)return'p-none'; const v=p.toLowerCase(); if(v.includes('must'))return'p-must'; if(v.includes('should'))return'p-should'; if(v.includes('could'))return'p-could'; return'p-none';}
function storyBoxClass(status){if(!status)return'sb-other'; if(status.includes('Canceled')||status.includes('Cancelled'))return'sb-canceled'; if(status.includes('Complete')||status.includes('PASS'))return'sb-complete'; if(status.includes('QA'))return'sb-qa'; if(status.includes('Development'))return'sb-dev'; if(status.includes('Design'))return'sb-design'; if(status.includes('Hand-off'))return'sb-handoff'; if(status.includes('Not Started'))return'sb-notstarted'; if(status.includes('Draft'))return'sb-draft'; if(status.includes('BA'))return'sb-ba'; return'sb-other';}

function buildStory(s, theme, feature){
  const meta = [
    s.status ? `<span class="meta-tag ${statusClass(s.status)}">${esc(s.status)}</span>` : '',
    s.priority ? `<span class="meta-tag ${priorityClass(s.priority)}">${esc(s.priority)}</span>` : '',
    s.user ? `<span class="meta-tag user-tag">${esc(s.user)}</span>` : '',
    s.id ? `<span class="meta-tag id-tag">${esc(s.id)}</span>` : '',
    s.mvp ? '<span class="mvp-badge mvp-yes">MVP</span>' : ''
  ].filter(Boolean).join('');
  const haystack = [theme, feature, s.title, s.status, s.priority, s.user, s.id].filter(Boolean).join(' | ').toLowerCase();
  return `<div class="story-box ${storyBoxClass(s.status)}" data-status="${esc(s.status || '')}" data-priority="${esc(s.priority || '')}" data-user="${esc(s.user || '')}" data-search="${esc(haystack)}" data-mvp="${String(!!s.mvp)}"><div class="story-title">${esc(s.title)}</div><div class="story-meta">${meta}</div></div>`;
}

function buildFeature(theme, fname, featureData){
  const badge = `<span class="mvp-badge ${featureData.mvp ? 'mvp-yes' : 'mvp-no'}">${featureData.mvp ? 'MVP' : 'NOT MVP'}</span>`;
  const stories = (featureData.stories || []).map(s => `<div class="story-connector"></div>${buildStory(s, theme, fname)}`).join('');
  return `<div class="feature-col" data-mvp="${String(!!featureData.mvp)}" data-search="${esc((theme + ' | ' + fname).toLowerCase())}"><div class="feature-connector"></div><div class="feature-box"><button class="feature-toggle-row" type="button" aria-expanded="true"><div class="feature-title"><span>${esc(fname)}</span>${badge}</div><span class="chevron" aria-hidden="true">▾</span></button></div><div class="stories-col">${stories}</div></div>`;
}

function render(){
  row.innerHTML = Object.entries(DATA).map(([theme, themeData]) => {
    const features = Object.entries(themeData.features).map(([fname, fdata], i) => `${i ? '<div class="feature-gap"></div>' : ''}${buildFeature(theme, fname, fdata)}`).join('');
    return `<section class="theme-col" data-search="${esc(theme.toLowerCase())}"><div class="theme-box"><button class="theme-toggle-row" type="button" aria-expanded="true"><span>${esc(theme)}</span><span class="chevron" aria-hidden="true">▾</span></button></div><div class="theme-connector"></div><div class="features-area"><div class="feature-hbar"></div>${features}</div></section>`;
  }).join('');
}

function fillSelect(selectEl, values){
  selectEl.innerHTML = selectEl.querySelector('option') ? selectEl.querySelector('option').outerHTML : '';
  [...values].sort((a,b)=>a.localeCompare(b)).forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    selectEl.appendChild(o);
  });
}

function populate(){
  const statuses = new Set(), priorities = new Set(), users = new Set();
  Object.values(DATA).forEach(t => Object.values(t.features).forEach(f => (f.stories || []).forEach(s => {
    if (s.status) statuses.add(s.status);
    if (s.priority) priorities.add(s.priority);
    if (s.user) s.user.split(/[\/,;#]+/).map(v => v.trim()).filter(Boolean).forEach(v => users.add(v));
  })));
  fillSelect(statusSelect, statuses);
  fillSelect(prioritySelect, priorities);
  fillSelect(userSelect, users);
}

function syncTrackWidth(){
  innerEl.style.width = Math.max(row.scrollWidth, canvasEl.clientWidth) + 'px';
  trackEl.scrollLeft = canvasEl.scrollLeft;
}

function updateSummary(){
  const visibleStories = document.querySelectorAll('.story-box:not(.story-hidden)').length;
  const totalStories = document.querySelectorAll('.story-box').length;
  const visibleFeatures = [...document.querySelectorAll('.feature-col')].filter(el => el.style.display !== 'none').length;
  const visibleThemes = [...document.querySelectorAll('.theme-col')].filter(el => el.style.display !== 'none').length;
  summary.innerHTML = `<span class="summary-tag">Visible stories: ${visibleStories} / ${totalStories}</span><span class="summary-tag">Visible features: ${visibleFeatures}</span><span class="summary-tag">Visible themes: ${visibleThemes}</span>`;
}

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const fStatus = statusSelect.value;
  const fPriority = prioritySelect.value;
  const fUser = userSelect.value;
  const fMvp = mvpSelect.value;

  document.querySelectorAll('.theme-col').forEach(themeCol => {
    let themeVisible = false;
    themeCol.querySelectorAll('.feature-col').forEach(featCol => {
      let featVisible = false;
      featCol.querySelectorAll('.story-box').forEach(box => {
        const users = (box.dataset.user || '').split(/[\/,;#]+/).map(v => v.trim()).filter(Boolean);
        const searchText = (box.dataset.search || '').toLowerCase();
        const featureText = (featCol.dataset.search || '').toLowerCase();
        const themeText = (themeCol.dataset.search || '').toLowerCase();
        const searchMatch = !q || searchText.includes(q) || featureText.includes(q) || themeText.includes(q);
        const mvpMatch = !fMvp || box.dataset.mvp === fMvp;
        const ok = (!fStatus || box.dataset.status === fStatus) && (!fPriority || box.dataset.priority === fPriority) && (!fUser || users.includes(fUser)) && mvpMatch && searchMatch;
        const conn = box.previousElementSibling;
        if (ok) {
          box.classList.remove('story-hidden');
          if (conn && conn.classList.contains('story-connector')) conn.style.display = '';
          featVisible = true;
        } else {
          box.classList.add('story-hidden');
          if (conn && conn.classList.contains('story-connector')) conn.style.display = 'none';
        }
      });
      featCol.style.display = featVisible ? 'flex' : 'none';
      if (featVisible) themeVisible = true;
    });
    themeCol.style.display = themeVisible ? 'flex' : 'none';
  });
  updateSummary();
  syncTrackWidth();
}

function setupCollapse(){
  document.querySelectorAll('.theme-toggle-row').forEach(btn => btn.addEventListener('click', () => {
    const col = btn.closest('.theme-col');
    const collapsed = col.classList.toggle('is-collapsed');
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    syncTrackWidth();
  }));
  document.querySelectorAll('.feature-toggle-row').forEach(btn => btn.addEventListener('click', () => {
    const col = btn.closest('.feature-col');
    const collapsed = col.classList.toggle('is-collapsed');
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    syncTrackWidth();
  }));
}

render();
populate();
setupCollapse();
applyFilters();
new ResizeObserver(syncTrackWidth).observe(canvasEl);
window.addEventListener('resize', syncTrackWidth);
let syncing = false;
trackEl.addEventListener('scroll', () => { if (syncing) return; syncing = true; canvasEl.scrollLeft = trackEl.scrollLeft; requestAnimationFrame(() => syncing = false); });
canvasEl.addEventListener('scroll', () => { if (syncing) return; syncing = true; trackEl.scrollLeft = canvasEl.scrollLeft; requestAnimationFrame(() => syncing = false); });
searchInput.addEventListener('input', applyFilters);
statusSelect.addEventListener('change', applyFilters);
prioritySelect.addEventListener('change', applyFilters);
userSelect.addEventListener('change', applyFilters);
mvpSelect.addEventListener('change', applyFilters);
resetBtn.addEventListener('click', () => { searchInput.value=''; statusSelect.value=''; prioritySelect.value=''; userSelect.value=''; mvpSelect.value=''; applyFilters(); });
</script>
</body>
</html>
