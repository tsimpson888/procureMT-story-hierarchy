const innerEl = document.getElementById('scroll-track-inner');

function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function statusClass(s){if(!s)return's-other'; if(s.includes('Complete')||s.includes('PASS'))return's-complete'; if(s.includes('QA'))return's-qa'; if(s.includes('Development'))return's-dev'; if(s.includes('Design'))return's-design'; if(s.includes('Hand-off'))return's-handoff'; if(s.includes('Not Started'))return's-notstarted'; if(s.includes('Draft'))return's-draft'; if(s.includes('BA'))return's-ba'; return's-other';}
function priorityClass(p){if(!p)return'p-none'; const v=p.toLowerCase(); if(v.includes('must'))return'p-must'; if(v.includes('should'))return'p-should'; if(v.includes('could'))return'p-could'; return'p-none';}
function storyBoxClass(status){if(!status)return'sb-other'; if(status.includes('Canceled')||status.includes('Cancelled'))return'sb-canceled'; if(status.includes('Complete')||status.includes('PASS'))return'sb-complete'; if(status.includes('QA'))return'sb-qa'; if(status.includes('Development'))return'sb-dev'; if(status.includes('Design'))return'sb-design'; if(status.includes('Hand-off'))return'sb-handoff'; if(status.includes('Not Started'))return'sb-notstarted'; if(status.includes('Draft'))return'sb-draft'; if(status.includes('BA'))return'sb-ba'; return'sb-other';}
function buildStory(s, theme, feature){const meta=[s.sprint?`<span class="meta-tag s-other">${esc(s.sprint)}</span>`:'', s.status?`<span class="meta-tag ${statusClass(s.status)}">${esc(s.status)}</span>`:'', s.priority?`<span class="meta-tag ${priorityClass(s.priority)}">${esc(s.priority)}</span>`:'', s.user?`<span class="meta-tag user-tag">${esc(s.user)}</span>`:'', s.id?`<span class="meta-tag id-tag">${esc(s.id)}</span>`:''].join(''); const haystack=[theme,feature,s.title,s.sprint,s.status,s.priority,s.user,s.id].filter(Boolean).join(' | ').toLowerCase(); return `<div class="story-box ${storyBoxClass(s.status)}" data-status="${esc(s.status||'')}" data-sprint="${esc(s.sprint||'')}" data-priority="${esc(s.priority||'')}" data-user="${esc(s.user||'')}" data-search="${esc(haystack)}" data-mvp="${String(!!s.mvp)}"><div class="story-title">${esc(s.title)}</div><div class="story-meta">${meta}</div></div>`;}
function buildFeature(theme, fname, featureData){const badge=`<span class="mvp-badge ${featureData.mvp?'mvp-yes':'mvp-no'}">${featureData.mvp?'MVP':'NOT MVP'}</span>`; const stories=(featureData.stories||[]).map(s=>`<div class="story-connector"></div>${buildStory(s, theme, fname)}`).join(''); return `<div class="feature-col" data-mvp="${String(!!featureData.mvp)}" data-search="${esc((theme+' | '+fname).toLowerCase())}"><div class="feature-connector"></div><div class="feature-box"><button class="feature-toggle-row" type="button" aria-expanded="true"><div class="feature-title"><span>${esc(fname)}</span>${badge}</div><span class="chevron" aria-hidden="true">▾</span></button></div><div class="stories-col">${stories}</div></div>`;}
function render(){row.innerHTML=Object.entries(DATA).map(([theme,themeData])=>{const features=Object.entries(themeData.features).map(([fname,fdata],i)=>`${i?'<div class="feature-gap"></div>':''}${buildFeature(theme,fname,fdata)}`).join(''); return `<section class="theme-col" data-search="${esc(theme.toLowerCase())}"><div class="theme-box"><button class="theme-toggle-row" type="button" aria-expanded="true"><span>${esc(theme)}</span><span class="chevron" aria-hidden="true">▾</span></button></div><div class="theme-connector"></div><div class="features-area"><div class="feature-hbar"></div>${features}</div></section>`;}).join('');}
function fillSelect(selectEl, values){const first=selectEl.querySelector('option').outerHTML; selectEl.innerHTML=first; [...values].sort((a,b)=>a.localeCompare(b)).forEach(v=>{const o=document.createElement('option'); o.value=v; o.textContent=v; selectEl.appendChild(o);});}
function populate(){const statuses=new Set(), sprints=new Set(), priorities=new Set(), users=new Set(); Object.values(DATA).forEach(t=>Object.values(t.features).forEach(f=>(f.stories||[]).forEach(s=>{if(s.status)statuses.add(s.status); if(s.sprint)sprints.add(s.sprint); if(s.priority)priorities.add(s.priority); if(s.user)s.user.split(/[\/,;#]+/).map(v=>v.trim()).filter(Boolean).forEach(v=>users.add(v));}))); fillSelect(statusSelect,statuses); fillSelect(sprintSelect,sprints); fillSelect(prioritySelect,priorities); fillSelect(userSelect,users);}
function syncTrackWidth(){innerEl.style.width=Math.max(row.scrollWidth, canvasEl.clientWidth)+'px'; trackEl.scrollLeft=canvasEl.scrollLeft;}
function updateSummary(){const visibleStories=document.querySelectorAll('.story-box:not(.story-hidden)').length; const totalStories=document.querySelectorAll('.story-box').length; const visibleFeatures=[...document.querySelectorAll('.feature-col')].filter(el=>el.style.display!=='none').length; const visibleThemes=[...document.querySelectorAll('.theme-col')].filter(el=>el.style.display!=='none').length; summary.innerHTML=`<span class="summary-tag">Visible stories: ${visibleStories} / ${totalStories}</span><span class="summary-tag">Visible features: ${visibleFeatures}</span><span class="summary-tag">Visible themes: ${visibleThemes}</span>`;}
function applyFilters(){const q=searchInput.value.trim().toLowerCase(); const fStatus=statusSelect.value; const fSprint=sprintSelect.value; const fPriority=prioritySelect.value; const fUser=userSelect.value; const fMvp=mvpSelect.value; document.querySelectorAll('.theme-col').forEach(themeCol=>{let themeVisible=false; themeCol.querySelectorAll('.feature-col').forEach(featCol=>{let featVisible=false; featCol.querySelectorAll('.story-box').forEach(box=>{const users=(box.dataset.user||'').split(/[\/,;#]+/).map(v=>v.trim()).filter(Boolean); const searchText=(box.dataset.search||'').toLowerCase(); const featureText=(featCol.dataset.search||'').toLowerCase(); const themeText=(themeCol.dataset.search||'').toLowerCase(); const searchMatch=!q||searchText.includes(q)||featureText.includes(q)||themeText.includes(q); const mvpMatch=!fMvp||box.dataset.mvp===fMvp; const ok=(!fStatus||box.dataset.status===fStatus)&&(!fSprint||box.dataset.sprint===fSprint)&&(!fPriority||box.dataset.priority===fPriority)&&(!fUser||users.includes(fUser))&&mvpMatch&&searchMatch; const conn=box.previousElementSibling; if(ok){box.classList.remove('story-hidden'); if(conn&&conn.classList.contains('story-connector'))conn.style.display=''; featVisible=true;} else {box.classList.add('story-hidden'); if(conn&&conn.classList.contains('story-connector'))conn.style.display='none';} }); featCol.style.display=featVisible?'flex':'none'; if(featVisible)themeVisible=true; }); themeCol.style.display=themeVisible?'flex':'none'; }); updateSummary(); syncTrackWidth();}
function setupCollapse(){document.querySelectorAll('.theme-toggle-row').forEach(btn=>btn.addEventListener('click',()=>{const col=btn.closest('.theme-col'); const collapsed=col.classList.toggle('is-collapsed'); btn.setAttribute('aria-expanded',collapsed?'false':'true'); syncTrackWidth();})); document.querySelectorAll('.feature-toggle-row').forEach(btn=>btn.addEventListener('click',()=>{const col=btn.closest('.feature-col'); const collapsed=col.classList.toggle('is-collapsed'); btn.setAttribute('aria-expanded',collapsed?'false':'true'); syncTrackWidth();}));}
render(); populate(); setupCollapse(); applyFilters(); new ResizeObserver(syncTrackWidth).observe(canvasEl); window.addEventListener('resize', syncTrackWidth); let syncing=false; trackEl.addEventListener('scroll',()=>{if(syncing)return; syncing=true; canvasEl.scrollLeft=trackEl.scrollLeft; requestAnimationFrame(()=>syncing=false);}); canvasEl.addEventListener('scroll',()=>{if(syncing)return; syncing=true; trackEl.scrollLeft=canvasEl.scrollLeft; requestAnimationFrame(()=>syncing=false);}); searchInput.addEventListener('input', applyFilters); statusSelect.addEventListener('change', applyFilters); sprintSelect.addEventListener('change', applyFilters); prioritySelect.addEventListener('change', applyFilters); userSelect.addEventListener('change', applyFilters); mvpSelect.addEventListener('change', applyFilters); resetBtn.addEventListener('click',()=>{searchInput.value=''; statusSelect.value=''; sprintSelect.value=''; prioritySelect.value=''; userSelect.value=''; mvpSelect.value=''; applyFilters();});
</script>
</body>
</html>
