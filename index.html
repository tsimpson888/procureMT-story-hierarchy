ust have", "user": "System", "mvp": false}, {"id": "40", "title": "Fix Test Procurement API Deployment", "status": "8-Complete", "sprint": "SP00", "priority": "1-must have", "user": "System", "mvp": false}, {"id": "41", "title": "Make Environment Secrets File Work", "status": "8-Complete", "sprint": "SP00", "priority": "1-must have", "user": "System", "mvp": false}, {"id": "42", "title": "Show Front End Is Up (Even If Back End Is Not)", "status": "8-Complete", "sprint": "SP00", "priority": "1-must have", "user": "System", "mvp": false}, {"id": "72", "title": "508 Compliance", "status": "1a-Not Started", "sprint": "Backlog", "priority": "", "user": "System", "mvp": false}]}}}};
const row = document.getElementById('themes-row');
const searchInput = document.getElementById('q-search');
const statusSelect = document.getElementById('f-status');
const sprintSelect = document.getElementById('f-sprint');
const prioritySelect = document.getElementById('f-priority');
const userSelect = document.getElementById('f-user');
const mvpSelect = document.getElementById('f-mvp');
const resetBtn = document.getElementById('btn-reset');
const summary = document.getElementById('summary');
const canvasEl = document.getElementById('canvas');
const trackEl = document.getElementById('scroll-track');
const innerEl = document.getElementById('scroll-track-inner');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function statusClass(s){if(!s)return's-other'; if(s.includes('Complete')||s.includes('PASS'))return's-complete'; if(s.includes('QA'))return's-qa'; if(s.includes('Development'))return's-dev'; if(s.includes('Design'))return's-design'; if(s.includes('Hand-off'))return's-handoff'; if(s.includes('Not Started'))return's-notstarted'; if(s.includes('Draft'))return's-draft'; if(s.includes('BA'))return's-ba'; return's-other';}
function priorityClass(p){if(!p)return'p-none'; const v=p.toLowerCase(); if(v.includes('must'))return'p-must'; if(v.includes('should'))return'p-should'; if(v.includes('could'))return'p-could'; return'p-none';}
function storyBoxClass(status){if(!status)return'sb-other'; if(status.includes('Canceled')||status.includes('Cancelled'))return'sb-canceled'; if(status.includes('Complete')||status.includes('PASS'))return'sb-complete'; if(status.includes('QA'))return'sb-qa'; if(status.includes('Development'))return'sb-dev'; if(status.includes('Design'))return'sb-design'; if(status.includes('Hand-off'))return'sb-handoff'; if(status.includes('Not Started'))return'sb-notstarted'; if(status.includes('Draft'))return'sb-draft'; if(status.includes('BA'))return'sb-ba'; return'sb-other';}
function slug(str){return String(str||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function buildStory(s, theme, feature){
  const meta=[
    s.sprint?'<span class="meta-tag s-other">'+esc(s.sprint)+'</span>':'',
    s.status?'<span class="meta-tag '+statusClass(s.status)+'">'+esc(s.status)+'</span>':'',
    s.priority?'<span class="meta-tag '+priorityClass(s.priority)+'">'+esc(s.priority)+'</span>':'',
    s.user?'<span class="meta-tag user-tag">'+esc(s.user)+'</span>':'',
    s.id?'<span class="meta-tag id-tag">'+esc(s.id)+'</span>':''
  ].join('');
  const haystack=[theme,feature,s.title,s.sprint,s.status,s.priority,s.user,s.id].filter(Boolean).join(' | ').toLowerCase();
  return '<div class="story-box '+storyBoxClass(s.status)+'" data-status="'+esc(s.status||'')+'" data-sprint="'+esc(s.sprint||'')+'" data-priority="'+esc(s.priority||'')+'" data-user="'+esc(s.user||'')+'" data-search="'+esc(haystack)+'" data-mvp="'+String(!!s.mvp)+'"><div class="story-title">'+esc(s.title)+'</div><div class="story-meta">'+meta+'</div></div>';
}
function buildFeature(theme, fname, featureData){
  const badge='<span class="mvp-badge '+(featureData.mvp?'mvp-yes':'mvp-no')+'">'+(featureData.mvp?'MVP':'NOT MVP')+'</span>';
  const stories=(featureData.stories||[]).map(function(s){return '<div class="story-connector"></div>'+buildStory(s, theme, fname);}).join('');
  const empty=(featureData.stories||[]).length===0?'<div class="feature-empty">0 stories yet</div>':'';
  return '<div class="feature-col" data-mvp="'+String(!!featureData.mvp)+'" data-search="'+esc((theme+' | '+fname).toLowerCase())+'"><div class="feature-connector"></div><div class="feature-box feature-'+slug(fname)+'"><button class="feature-toggle-row" type="button" aria-expanded="true"><div class="feature-title"><span>'+esc(fname)+'</span>'+badge+'</div><span class="chevron" aria-hidden="true">▾</span></button>'+empty+'</div><div class="stories-col">'+stories+'</div></div>';
}
function render(){
  row.innerHTML=Object.entries(DATA).map(function(entry){
    var theme=entry[0], themeData=entry[1];
    var features=Object.entries(themeData.features).map(function(fEntry, i){
      var fname=fEntry[0], fdata=fEntry[1];
      return (i?'<div class="feature-gap"></div>':'')+buildFeature(theme,fname,fdata);
    }).join('');
    return '<section class="theme-col" data-search="'+esc(theme.toLowerCase())+'"><div class="theme-box theme-'+slug(theme)+'"><button class="theme-toggle-row" type="button" aria-expanded="true"><span>'+esc(theme)+'</span><span class="chevron" aria-hidden="true">▾</span></button></div><div class="theme-connector"></div><div class="features-area"><div class="feature-hbar"></div>'+features+'</div></section>';
  }).join('');
}
function fillSelect(selectEl, values){
  var first=selectEl.querySelector('option').outerHTML;
  selectEl.innerHTML=first;
  Array.from(values).sort(function(a,b){return a.localeCompare(b);}).forEach(function(v){
    var o=document.createElement('option'); o.value=v; o.textContent=v; selectEl.appendChild(o);
  });
}
function populate(){
  var statuses=new Set(), sprints=new Set(), priorities=new Set(), users=new Set();
  Object.values(DATA).forEach(function(t){
    Object.values(t.features).forEach(function(f){
      (f.stories||[]).forEach(function(s){
        if(s.status)statuses.add(s.status);
        if(s.sprint)sprints.add(s.sprint);
        if(s.priority)priorities.add(s.priority);
        if(s.user)s.user.split(/[\/,;#]+/).map(function(v){return v.trim();}).filter(Boolean).forEach(function(v){users.add(v);});
      });
    });
  });
  fillSelect(statusSelect,statuses); fillSelect(sprintSelect,sprints); fillSelect(prioritySelect,priorities); fillSelect(userSelect,users);
}
function syncTrackWidth(){ innerEl.style.width=Math.max(row.scrollWidth, canvasEl.clientWidth)+'px'; trackEl.scrollLeft=canvasEl.scrollLeft; }
function updateSummary(){
  var visibleStories=document.querySelectorAll('.story-box:not(.story-hidden)').length;
  var totalStories=document.querySelectorAll('.story-box').length;
  var totalFeatures=document.querySelectorAll('.feature-col').length;
  var totalThemes=document.querySelectorAll('.theme-col').length;
  summary.innerHTML='<span class="summary-tag">Visible stories: '+visibleStories+' / '+totalStories+'</span><span class="summary-tag">Features: '+totalFeatures+'</span><span class="summary-tag">Themes: '+totalThemes+'</span>';
}
function applyFilters(){
  var q=searchInput.value.trim().toLowerCase();
  var fStatus=statusSelect.value, fSprint=sprintSelect.value, fPriority=prioritySelect.value, fUser=userSelect.value, fMvp=mvpSelect.value;
  document.querySelectorAll('.theme-col').forEach(function(themeCol){
    themeCol.querySelectorAll('.feature-col').forEach(function(featCol){
      featCol.querySelectorAll('.story-box').forEach(function(box){
        var users=(box.dataset.user||'').split(/[\/,;#]+/).map(function(v){return v.trim();}).filter(Boolean);
        var searchText=(box.dataset.search||'').toLowerCase();
        var featureText=(featCol.dataset.search||'').toLowerCase();
        var themeText=(themeCol.dataset.search||'').toLowerCase();
        var searchMatch=!q||searchText.includes(q)||featureText.includes(q)||themeText.includes(q);
        var mvpMatch=!fMvp||box.dataset.mvp===fMvp;
        var ok=(!fStatus||box.dataset.status===fStatus)&&(!fSprint||box.dataset.sprint===fSprint)&&(!fPriority||box.dataset.priority===fPriority)&&(!fUser||users.includes(fUser))&&mvpMatch&&searchMatch;
        var conn=box.previousElementSibling;
        if(ok){box.classList.remove('story-hidden'); if(conn&&conn.classList.contains('story-connector')) conn.style.display='';}
        else {box.classList.add('story-hidden'); if(conn&&conn.classList.contains('story-connector')) conn.style.display='none';}
      });
    });
  });
  updateSummary(); syncTrackWidth();
}
function setupCollapse(){
  document.querySelectorAll('.theme-toggle-row').forEach(function(btn){
    btn.addEventListener('click',function(){
      var col=btn.closest('.theme-col');
      var collapsed=col.classList.toggle('is-collapsed');
      btn.setAttribute('aria-expanded',collapsed?'false':'true');
      syncTrackWidth();
    });
  });
  document.querySelectorAll('.feature-toggle-row').forEach(function(btn){
    btn.addEventListener('click',function(){
      var col=btn.closest('.feature-col');
      var collapsed=col.classList.toggle('is-collapsed');
      btn.setAttribute('aria-expanded',collapsed?'false':'true');
      syncTrackWidth();
    });
  });
}
render(); populate(); setupCollapse(); applyFilters();
new ResizeObserver(syncTrackWidth).observe(canvasEl);
window.addEventListener('resize', syncTrackWidth);
let syncing=false;
trackEl.addEventListener('scroll',function(){ if(syncing)return; syncing=true; canvasEl.scrollLeft=trackEl.scrollLeft; requestAnimationFrame(function(){syncing=false;}); });
canvasEl.addEventListener('scroll',function(){ if(syncing)return; syncing=true; trackEl.scrollLeft=canvasEl.scrollLeft; requestAnimationFrame(function(){syncing=false;}); });
searchInput.addEventListener('input', applyFilters); statusSelect.addEventListener('change', applyFilters); sprintSelect.addEventListener('change', applyFilters); prioritySelect.addEventListener('change', applyFilters); userSelect.addEventListener('change', applyFilters); mvpSelect.addEventListener('change', applyFilters);
resetBtn.addEventListener('click',function(){ searchInput.value=''; statusSelect.value=''; sprintSelect.value=''; prioritySelect.value=''; userSelect.value=''; mvpSelect.value=''; applyFilters(); });
</script>
