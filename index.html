  <script>
    const DATA = {"Other": {"features": {"Application": {"mvp": false, "stories": [{"id": "1", "title": "Application- Config (may need to split???)", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "I must create a procurement application, so state users can submit and manage procurement requests while on the state network."}]}, "Data Exports": {"mvp": false, "stories": [{"id": "54", "title": "Data Exports", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Data Movement": {"mvp": false, "stories": [{"id": "55", "title": "Data Movement", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Bulk Operations": {"mvp": false, "stories": [{"id": "56", "title": "Bulk Operations", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Mobile": {"mvp": false, "stories": [{"id": "57", "title": "Mobile", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Other Configuration Management": {"mvp": false, "stories": [{"id": "58", "title": "Other Configuration Management", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "User Preference Management": {"mvp": false, "stories": [{"id": "59", "title": "User Preference Management", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}}}, "Workspace": {"features": {"Requester Workspace": {"mvp": false, "stories": [{"id": "2", "title": "Requester Workspace-Config", "status": "1a-Not Started", "priority": "", "user": "Requester", "desc": ""}, {"id": "17", "title": "Requester Workspace-Detail", "status": "1a-Not Started", "priority": "", "user": "Requester", "desc": ""}]}, "Procurement Workspace": {"mvp": false, "stories": [{"id": "3", "title": "Procurement Workspace-Config", "status": "6b-BA Testing PASS", "priority": "", "user": "System", "desc": "I must create a workspace where procurement and leadership staff can see everything they need to see to do their work."}, {"id": "44", "title": "Procurement Workspace-Detail-Step/Status Visibility", "status": "2-Design", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I need to be able to easily see the Step and Status of a Request so that I can determine where it is in the overall workflow."}, {"id": "45", "title": "Procurement Workspace-Detail-Threshold Queue Visibility", "status": "2-Design", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I need to be able to easily locate the Open Requests by Threshold Queue so that I can open them.  I need to be able to see Queue name and be able to Open the Queue."}]}}}, "Visibility & Tracking": {"features": {"Status Tracking and Management": {"mvp": false, "stories": [{"id": "4", "title": "State/Step/Status Mapping-Config", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": "I need to configure statep/step/status to enable request tracking."}, {"id": "35", "title": "Status Tracking and Management", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Action History Interface": {"mvp": false, "stories": [{"id": "34", "title": "Action History Interface", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}, {"id": "66", "title": "Audit Trail", "status": "8-Canceled", "priority": "1-must have", "user": "System", "desc": "To support story 24 and other future stories, we need to ensure that we have field level auditing on requests."}]}, "Compliance and Audit History": {"mvp": false, "stories": [{"id": "62", "title": "Audit History-Field Level", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": "To support story 24 and other future stories, we need to ensure that we have field level auditing on requests."}]}, "Event-Based Notifications": {"mvp": false, "stories": [{"id": "63", "title": "Event-Based Notifications", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Reminder and Escalation Notifications": {"mvp": false, "stories": [{"id": "64", "title": "Reminder and Escalation Notifications", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}}}, "Workflow & Routing Engine": {"features": {"Entity Configuration Management": {"mvp": false, "stories": [{"id": "5", "title": "Commodity Codes-Config", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": "I need to store a list of static commodity codes that contain details about the commodity code.  This list will be maintained by non-business staff within the system."}, {"id": "8", "title": "EntitySpendingCodeMatrix-Config", "status": "2-Design", "priority": "1-must have", "user": "System", "desc": "I need to configure each state entity with their allowed delegated authority thresholds and allowed commodity codes, so that post approval routing rules work correctly."}, {"id": "46", "title": "EntityList-Config", "status": "2-Design", "priority": "1-must have", "user": "System", "desc": "I need to configure a master list of each state entity with their name and (agency) code for use throughout the application.  Load info for all of the Entities listed on the spreadsheet where MVP = Yes."}]}}}, "Access Control": {"features": {"Roles and Permissions": {"mvp": false, "stories": [{"id": "6", "title": "RBAC-Config", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": ""}]}, "Assignment Groups and Members Management": {"mvp": false, "stories": [{"id": "7", "title": "Assignment Groups-Config", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": "I need to configure assignment groups so that requests can be routed appropriately."}, {"id": "10", "title": "Assignment Groups-Create", "status": "1a-Not Started", "priority": "", "user": "Agency IT", "desc": ""}, {"id": "11", "title": "Assignment Groups-Manage", "status": "1a-Not Started", "priority": "", "user": "Agency IT", "desc": ""}]}, "System Security and Authentication": {"mvp": false, "stories": [{"id": "47", "title": "System Security and Authentication", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}}}, "Assignment & Work Distribution": {"features": {"Auto/Manual Step & Group Progression": {"mvp": false, "stories": [{"id": "9", "title": "Post Approval Routing", "status": "2-Design", "priority": "1-must have", "user": "System", "desc": "I need to evaluate specific refined info (fields) once the request has been approved so the request is routed to the appropriate Assignment Group and Step/Status for sourcing actions.\n\nThis story represents the expected system evaluation and logic behind the automatic Assignment Group and automatic Step/Status update that is triggered upon a Request entering the Approval/Approved Step/Status."}, {"id": "15", "title": "Auto Step Upon Save as Draft", "status": "2-Design", "priority": "3-could have", "user": "System", "desc": "I need to auto update the step/status to Request/Draft upon save as draft."}, {"id": "18", "title": "Auto Step Upon Submit", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "System", "desc": "I need to auto update the step/status to Intake/New upon submit."}, {"id": "19", "title": "Auto Group Upon Submit", "status": "3b-In Development", "priority": "1-must have", "user": "System", "desc": "I need to auto update the assignment group to Procurement Group upon submit."}, {"id": "21", "title": "Manual Intake in Process - Temp (Change assignment)", "status": "3b-In Development", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to indicate when the intake is in process."}, {"id": "27", "title": "Manual Ready for Approval", "status": "3a-Hand-off to Product Mgr", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to indicate when intake/refinement is complete to show that the request is ready for the approval path."}, {"id": "31", "title": "Manual Approval Complete - Temp", "status": "3a-Hand-off to Product Mgr", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to indicate when the request has been approved by the required parties so I know the request is ready to be sent for sourcing."}, {"id": "32", "title": "Manually Assign Sourcing Assignment Group and Status - Temp", "status": "3a-Hand-off to Product Mgr", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to indicate the sourcing status and assignment group so that the request can be sent to the correct group for sourcing."}]}, "Individual Assignment": {"mvp": false, "stories": [{"id": "20", "title": "Assigned To or Claim", "status": "1b-Draft", "priority": "", "user": "Procurement Group;#Leadership Group", "desc": "I need a way to assign a request to myself or another person in request's assignment group."}]}, "Reassignments": {"mvp": false, "stories": [{"id": "36", "title": "Reassignments", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Auto Procurement Method Classification": {"mvp": false, "stories": [{"id": "50", "title": "Auto Procurement Method Classification", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Auto Round Robin Rerouting Capabilities": {"mvp": false, "stories": [{"id": "51", "title": "Auto Round Robin Rerouting Capabilities", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Escalations": {"mvp": false, "stories": [{"id": "52", "title": "Escalations", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Manual Workload Management": {"mvp": false, "stories": [{"id": "53", "title": "Manual Workload Management", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Dynamic Workflow Reroute": {"mvp": false, "stories": [{"id": "65", "title": "Dynamic Workflow Rerouting", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}}}, "Request Intake & Management": {"features": {"Request Management": {"mvp": false, "stories": [{"id": "12", "title": "Create Request - Enterprise Fields", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "Requester", "desc": "I must be able to create a request on an easy-to-find procurement request form, so that I can initiate a purchase request."}, {"id": "14", "title": "Save Draft Request", "status": "2-Design", "priority": "3-could have", "user": "Requester", "desc": "I must be able to save my request as a draft, so that I can gather information over time and submit when ready."}, {"id": "16", "title": "Submit Request", "status": "6a-Ready for BA Testing", "priority": "1-must have", "user": "Requester", "desc": "I must be able to submit the request form.  I want the system to validate my form on submit, so that I know I've provided all required information.  I must receive confirmation and a tracking number upon a successful submit, so that I can reference it in future communications."}]}, "Attachment Management": {"mvp": false, "stories": [{"id": "13", "title": "Add Attachments During Request", "status": "2-Design", "priority": "1-must have", "user": "Requester", "desc": "I must be able to attach supporting documents to my request prior to submitting my request, so that reviewers have complete information."}, {"id": "26", "title": "Add Attachments After Submission", "status": "2-Design", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I must be able to attach supporting documents to any request I have access to, so that reviewers have complete information."}, {"id": "67", "title": "Attachments - FileNet Capabilities Outside of User Stories", "status": "1a-Not Started", "priority": "", "user": "", "desc": "FileNet capabilities that haven't yet been called out in related attachment stories.  Do we need any of their capabilities?  Which ones?  By when?"}]}, "Refined Request Management": {"mvp": false, "stories": [{"id": "24", "title": "View Original Request Details", "status": "3a-Hand-off to Product Mgr", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to see the request details so that I know what is being requested.  I should not be able to edit the original request details.\n\nInformation must be organized in a logical, easy-to-navigate fashion."}, {"id": "25", "title": "Add Refinement Details", "status": "3a-Hand-off to Product Mgr", "priority": "1-must have", "user": "Procurement Group", "desc": "I must be able to refine a request by adding information to it.\n\nThe refinement area must be organized in a logical, easy-to-navigate fashion."}]}, "Cancelations": {"mvp": false, "stories": [{"id": "33", "title": "Cancelations", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}}}, "Reporting & Insights": {"features": {"Queue Interface": {"mvp": false, "stories": [{"id": "22", "title": "Threshold Procurement Group Queues", "status": "2-Design", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I must be able to see requests organized by Threshold to facilitate workload management."}, {"id": "23", "title": "Procurement Group Queue-Details", "status": "3b-In Development", "priority": "2-should have", "user": "Procurement Group", "desc": "I must be able to see key request information while looking at the queue to facilitate workload management."}, {"id": "38", "title": "Sourcing Procurement Group Queues", "status": "1b-Draft", "priority": "1-must have", "user": "Procurement Group;#Leadership Group", "desc": "I must be able to see requests organized by Sourcing queues to facilitate workload management."}]}, "Search and Filter Capabilities": {"mvp": false, "stories": [{"id": "37", "title": "Search and Filter Capabilities", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Operational Reports": {"mvp": false, "stories": [{"id": "60", "title": "Operational Reports", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Dashboards": {"mvp": false, "stories": [{"id": "61", "title": "Dashboards", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}}}, "Approvals": {"features": {"Approval Path Builder": {"mvp": false, "stories": [{"id": "28", "title": "Approval Path Builder", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Approval Path Execution": {"mvp": false, "stories": [{"id": "29", "title": "Approval Path Execution", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Approval Path Override": {"mvp": false, "stories": [{"id": "30", "title": "Approval Path Override", "status": "1a-Not Started", "priority": "", "user": "", "desc": ""}]}, "Auto IT Approval Needed Classification": {"mvp": false, "stories": [{"id": "48", "title": "Auto IT Approval Needed Classification", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}, "Auto OBPP Approval Required Classification": {"mvp": false, "stories": [{"id": "49", "title": "Auto OBPP Approval Required Classification", "status": "1a-Not Started", "priority": "", "user": "", "desc": "placeholder story - see feature description"}]}}}, "Unassigned": {"features": {"Unassigned": {"mvp": false, "stories": [{"id": "39", "title": "Delegation Setup In Database (Cross‑Cutting)", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a system architect, I want delegation set up in the database as a cross‑cutting capability, so future security and features can be built with delegation in mind across the whole application."}, {"id": "40", "title": "Fix Test Procurement API Deployment", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a developer, I want the test procurement API to deploy and stay healthy, so the back end can be tested and used."}, {"id": "41", "title": "Make Environment Secrets File Work", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a developer, I want the environment (secrets) file to generate correctly, so the app has the passwords and other secrets it needs to run."}, {"id": "42", "title": "Show Front End Is Up (Even If Back End Is Not)", "status": "8-Complete", "priority": "1-must have", "user": "System", "desc": "As a product owner, I want to see that the front end deploys and users can log in, so we can show visible progress even while the back end is still down."}]}}}};
    const themesRow = document.getElementById('themes-row');
    const searchInput = document.getElementById('q-search');
    const filters = { status: document.getElementById('f-status'), priority: document.getElementById('f-priority'), user: document.getElementById('f-user'), mvp: document.getElementById('f-mvp') };
    const summary = document.getElementById('summary');

    const esc = (v='') => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const statusClass = (s='') => !s ? 's-other' : s.includes('Complete') || s.includes('PASS') ? 's-complete' : s.includes('QA') ? 's-qa' : s.includes('Development') ? 's-dev' : s.includes('Design') ? 's-design' : s.includes('Hand-off') ? 's-handoff' : s.includes('Not Started') ? 's-notstarted' : s.includes('Draft') ? 's-draft' : s.includes('BA') ? 's-ba' : 's-other';
    const storyBoxClass = (s='') => !s ? 'sb-other' : s.includes('Canceled') || s.includes('Cancelled') ? 'sb-canceled' : s.includes('Complete') || s.includes('PASS') ? 'sb-complete' : s.includes('QA') ? 'sb-qa' : s.includes('Development') ? 'sb-dev' : s.includes('Design') ? 'sb-design' : s.includes('Hand-off') ? 'sb-handoff' : s.includes('Not Started') ? 'sb-notstarted' : s.includes('Draft') ? 'sb-draft' : s.includes('BA') ? 'sb-ba' : 'sb-other';
    const priorityClass = (p='') => !p ? 'p-none' : p.toLowerCase().includes('must') ? 'p-must' : p.toLowerCase().includes('should') ? 'p-should' : p.toLowerCase().includes('could') ? 'p-could' : 'p-none';
    const tag = (label, cls) => `<span class="tag ${cls}">${esc(label)}</span>`;

    function buildStory(story, themeName, featureName) {
      const meta = [story.status ? tag(story.status, statusClass(story.status)) : '', story.priority ? tag(story.priority, priorityClass(story.priority)) : '', story.user ? tag(story.user, 'user-tag') : '', story.id ? tag(story.id, 'id-tag') : ''].filter(Boolean).join('');
      const desc = story.desc ? `<div class="story-desc">${esc(story.desc)}</div>` : '';
      const haystack = [themeName, featureName, story.title, story.status, story.priority, story.user, story.desc, story.id].filter(Boolean).join(' | ').toLowerCase();
      return `<div class="story-box ${storyBoxClass(story.status)}" data-status="${esc(story.status || '')}" data-priority="${esc(story.priority || '')}" data-user="${esc(story.user || '')}" data-search="${esc(haystack)}"><div class="story-title">${esc(story.title)}</div>${desc}<div class="story-meta">${meta}</div></div>`;
    }

    function buildFeature(themeName, featureName, featureData) {
      const storiesMarkup = featureData.stories.map(story => `<div class="story-connector"></div>${buildStory(story, themeName, featureName)}`).join('');
      return `<div class="feature-col" data-mvp="${String(featureData.mvp)}" data-search="${esc((themeName + ' | ' + featureName).toLowerCase())}"><div class="feature-connector"></div><div class="feature-box"><button class="feature-toggle-row" type="button" aria-expanded="true"><div class="feature-title"><span>${esc(featureName)}</span><span class="tag mvp-badge ${featureData.mvp ? '' : 'not'}">${featureData.mvp ? 'MVP' : 'Not MVP'}</span></div><span class="chevron" aria-hidden="true">▾</span></button></div><div class="stories-col">${storiesMarkup}</div></div>`;
    }

    function renderBoard() {
      themesRow.innerHTML = Object.entries(DATA).map(([themeName, themeData]) => {
        const featuresMarkup = Object.entries(themeData.features).map(([featureName, featureData], i) => `${i ? '<div class="feature-gap"></div>' : ''}${buildFeature(themeName, featureName, featureData)}`).join('');
        return `<section class="theme-col" data-search="${esc(themeName.toLowerCase())}"><div class="theme-box"><button class="theme-toggle-row" type="button" aria-expanded="true"><span>${esc(themeName)}</span><span class="chevron" aria-hidden="true">▾</span></button></div><div class="theme-connector"></div><div class="features-area"><div class="feature-hbar"></div>${featuresMarkup}</div></section>`;
      }).join('');
    }

    function populateFilters() {
      const statuses = new Set(), priorities = new Set(), users = new Set();
      Object.values(DATA).forEach(theme => Object.values(theme.features).forEach(feature => feature.stories.forEach(story => { if (story.status) statuses.add(story.status); if (story.priority) priorities.add(story.priority); if (story.user) story.user.split(',').map(v => v.trim()).filter(Boolean).forEach(v => users.add(v)); })));
      const fill = (el, vals) => vals.sort((a,b) => a.localeCompare(b)).forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; el.appendChild(o); });
      fill(filters.status, [...statuses]); fill(filters.priority, [...priorities]); fill(filters.user, [...users]);
    }

    function updateSummary() {
      const visibleStories = [...document.querySelectorAll('.story-box:not(.story-hidden)')].length;
      const totalStories = document.querySelectorAll('.story-box').length;
      const visibleFeatures = [...document.querySelectorAll('.feature-col:not(.feature-dimmed)')].length;
      const visibleThemes = [...document.querySelectorAll('.theme-col:not(.theme-dimmed)')].length;
      summary.innerHTML = `<span class="tag">Visible stories: ${visibleStories} / ${totalStories}</span><span class="tag">Visible features: ${visibleFeatures}</span><span class="tag">Visible themes: ${visibleThemes}</span>`;
    }

    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const status = filters.status.value;
      const priority = filters.priority.value;
      const user = filters.user.value;
      const mvp = filters.mvp.value;
      document.querySelectorAll('.theme-col').forEach(themeCol => {
        let themeVisible = false;
        themeCol.querySelectorAll('.feature-col').forEach(featureCol => {
          const mvpMatch = !mvp || featureCol.dataset.mvp === mvp;
          const storyBoxes = [...featureCol.querySelectorAll('.story-box')];
          let featureVisible = false;
          storyBoxes.forEach(box => {
            const boxUser = (box.dataset.user || '').split(',').map(v => v.trim());
            const searchMatch = !q || box.dataset.search.includes(q) || featureCol.dataset.search.includes(q) || themeCol.dataset.search.includes(q);
            const matches = mvpMatch && (!status || box.dataset.status === status) && (!priority || box.dataset.priority === priority) && (!user || boxUser.includes(user)) && searchMatch;
            const connector = box.previousElementSibling;
            if (matches) { box.classList.remove('story-hidden'); if (connector?.classList.contains('story-connector')) connector.style.display = 'block'; featureVisible = true; }
            else { box.classList.add('story-hidden'); if (connector?.classList.contains('story-connector')) connector.style.display = 'none'; }
          });
          featureCol.classList.toggle('feature-dimmed', !featureVisible);
          if (featureVisible) themeVisible = true;
        });
        themeCol.classList.toggle('theme-dimmed', !themeVisible);
      });
      updateSummary();
    }

    function setupScrollSync() {
      const canvas = document.getElementById('canvas'), track = document.getElementById('scroll-track'), inner = document.getElementById('scroll-track-inner');
      let syncing = false;
      const syncWidth = () => inner.style.width = `${canvas.scrollWidth}px`;
      new ResizeObserver(syncWidth).observe(canvas); window.addEventListener('load', syncWidth); window.addEventListener('resize', syncWidth);
      track.addEventListener('scroll', () => { if (syncing) return; syncing = true; canvas.scrollLeft = track.scrollLeft; syncing = false; });
      canvas.addEventListener('scroll', () => { if (syncing) return; syncing = true; track.scrollLeft = canvas.scrollLeft; syncing = false; });
    }

    function setupThemeToggle() {
      const button = document.querySelector('[data-theme-toggle]'); const root = document.documentElement; let mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; root.setAttribute('data-theme', mode);
      const update = () => { button.setAttribute('aria-label', `Switch to ${mode === 'dark' ? 'light' : 'dark'} mode`); button.innerHTML = `<span aria-hidden="true">${mode === 'dark' ? '☀' : '◐'}</span>`; };
      update(); button.addEventListener('click', () => { mode = mode === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', mode); update(); });
    }

    function refreshScrollWidth() { const canvas = document.getElementById('canvas'); const inner = document.getElementById('scroll-track-inner'); inner.style.width = `${canvas.scrollWidth}px`; }

    function setupThemeCollapse() { document.querySelectorAll('.theme-toggle-row').forEach(btn => { btn.addEventListener('click', () => { const col = btn.closest('.theme-col'); const collapsed = col.classList.toggle('is-collapsed'); btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); refreshScrollWidth(); }); }); }

    function setupFeatureCollapse() { document.querySelectorAll('.feature-toggle-row').forEach(btn => { btn.addEventListener('click', () => { const col = btn.closest('.feature-col'); const collapsed = col.classList.toggle('is-collapsed'); btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); refreshScrollWidth(); }); }); }

    renderBoard(); populateFilters(); setupScrollSync(); setupThemeToggle(); setupThemeCollapse(); setupFeatureCollapse(); applyFilters();
    searchInput.addEventListener('input', applyFilters);
    Object.values(filters).forEach(el => el.addEventListener('change', applyFilters));
    document.getElementById('btn-reset').addEventListener('click', () => { searchInput.value = ''; Object.values(filters).forEach(el => el.value = ''); applyFilters(); });
  </script>
</body>
</html>
